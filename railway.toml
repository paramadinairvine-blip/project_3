[build]
builder = "nixpacks"
nixpacksConfigPath = "backend/nixpacks.toml"
buildCommand = "cd frontend && npm install && npm run build && cd ../backend && npm install && npx prisma generate && npx prisma migrate deploy"

[deploy]
startCommand = "cd backend && npx prisma migrate deploy && node src/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
